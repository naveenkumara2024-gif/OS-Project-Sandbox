# CI skeleton (Stage 0). Not executed in this stage. Before relying on it, pin each `uses:` to a
# full commit SHA (CLAUDE.md 6.7) and decide the Node.js versions to test.
name: ci

on:
  push:
    branches: [main, 'stage/**']
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # CI runs the checks a stock runner can run: types, lint, format and the unit tests. The
      # integration and escape tests run real cells, which need unprivileged mounts inside a user
      # namespace and a delegated cgroup; Ubuntu runners block the first (AppArmor) and have no
      # user systemd for the second, so every cell fails with isolation_unavailable. Those tests
      # run in WSL2 with `npm run check`, and the stage reports record the measured results.
      # The helper tests run the probe, which needs the built binaries.
      - run: node scripts/build-native.mjs all
      - run: npm run check:ci

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build release and debug-asan with -Werror
        run: node scripts/build-native.mjs all --cc=${{ matrix.cc }}
      - name: Probe output must be valid JSON
        run: |
          ./native/build/debug-asan/aegis-cell probe > probe.json
          node -e "JSON.parse(require('node:fs').readFileSync('probe.json', 'utf8'))"
      - name: Fuzz the launch-spec parser for 60 seconds
        if: matrix.cc == 'clang'
        run: |
          node scripts/build-native.mjs fuzz --cc=clang
          mkdir -p /tmp/spec-corpus && cp tests/fuzz/corpus/spec/* /tmp/spec-corpus/
          ./native/build/fuzz/fuzz-spec -max_total_time=60 -max_len=70000 /tmp/spec-corpus
      - name: Format and lint the native sources
        run: node scripts/check-native.mjs
